name: Profilescape

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: chethandvg/profilescape-grid@v1
        with:
          token: ${{ secrets.README_TOKEN }}
          readme: README.md
